name: .NET

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dotnet-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SharpBoss.sln

      - name: Build
        run: dotnet build SharpBoss.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test SharpBoss.Tests/SharpBoss.Tests.csproj --configuration Release --no-restore --logger "console;verbosity=normal"

      - name: Verify formatting
        if: runner.os == 'Linux'
        run: dotnet format SharpBoss.sln --verify-no-changes --no-restore

      - name: Audit NuGet dependencies
        if: runner.os == 'Linux'
        run: dotnet list SharpBoss.sln package --vulnerable --include-transitive
